    <!--
      Applies the saved palette BEFORE the first paint.

      ThemeSwitcher sets data-palette from an effect, which runs after React has
      mounted — so the page painted in the default red/navy palette and then
      swapped, producing a visible flash on every load. Prerendering made it more
      obvious, because there is now real content painted long before any
      JavaScript runs.

      This must stay inline and synchronous in <head>: an external or deferred
      script would run after the first paint and the flash would return. It is
      small enough that the parser cost is negligible, and every access is
      guarded because localStorage throws in private mode and when site data is
      blocked.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('platinaa-palette');
          if (p && /^[a-z0-9-]{1,32}$/.test(p)) {
            document.documentElement.setAttribute('data-palette', p);
          }
        } catch (e) { /* default palette is already correct */ }
      })();
    </script>
